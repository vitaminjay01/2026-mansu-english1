<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 만수중 영어 1학년</title>
<style>
  :root { --bg:#faf7f2; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --accent:#f97316; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --card:#1f2937; --ink:#f3f4f6; --muted:#9ca3af; --accent:#fb923c; --line:#374151; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.6; }

  h1 { font-size:1.9rem; margin:0 0 4px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:14px; }
  .card h2 { font-size:1.1rem; margin:0 0 6px; }
  .tag { display:inline-block; background:var(--accent); color:#fff; border-radius:999px; padding:1px 10px; font-size:.8rem; margin-right:6px; }
  .empty { color:var(--muted); }
  footer { color:var(--muted); font-size:.85rem; margin-top:40px; }
</style>
</head>
<body>

    <p><span class="tag">Unit 7</span><a href="./unit7-lesson3-5.html">You Know What? · 3~5차시 (읽기 / 비교급·최상급 / 그래프 설명 글쓰기)</a></p>

  <footer>2026 만수중학교 1학년 영어</footer>
